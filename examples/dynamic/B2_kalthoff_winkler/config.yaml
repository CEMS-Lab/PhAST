schema_version: 1
example: phast.examples.dynamic_kalthoff_shear.run
problem:
  name: Kalthoff-Winkler Impact
  reference: Borden et al. (2012), CMAME

acceptance:
  status: validated
  # Case-specific retained mesh-3 evidence. h_crack/l0 is approximately 1.28,
  # so this suppresses a general resolution warning rather than asserting mesh
  # convergence. See README.md before adapting this deck to a new study.
  suppress_warnings:
  - mesh_l0_resolution

# Reference public deck for the half-plate Kalthoff-Winkler benchmark.
# The retained reference mesh uses h_crack=0.25 mm.
geometry:
  type: kalthoff_winkler
  parameters:
    W: 100.0
    H: 100.0
    a: 50.0
    h_crack: 0.25
    h_coarse: 5.0

material:
  E: 190000.0           # 190 GPa
  nu: 0.30
  Gc: 22.13             # N/mm
  l0: 0.195             # mm
  rho: 8.0e-9           # tonne/mm^3 = 8000 kg/m^3
  energy_split: spectral
  pf_model: AT2
  eta_residual: 1.0e-7
  plane_stress: false

boundary_conditions:
- nodes: left_impact
  type: prescribe
  component: 0
  value: 1.0
- {nodes: bottom, type: symmetry, axis: y}

loading:
  protocol: simple
  t_total: 1.0e-04
  ramp_type: velocity_impact
  v0: 16.5
  t_ramp: 1.0e-06

solver:
  solver_type: explicit
  dt_safety: 0.8
  damage_every: 1

output:
  h5: true
  h5_every: 50
  fast: true
  print_every: 100
