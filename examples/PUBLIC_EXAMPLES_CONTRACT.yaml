schema_version: 1
purpose: Public PhAST examples contract for release promotion, docs, and CI drift checks.
source_tree: PhAST
public_target: CEMS-Lab/PhAST

principles:
  - Public examples are small, flat, runnable, and reproducible.
  - Public example files stay directly in the leaf example folder; do not split user-facing artifacts into `figures/` or `reference/` subfolders.
  - YAML-first examples must run through `python -m phast run <config.yaml>`.
  - YAML-first examples should include a `run_fluent.py` script showing the equivalent Python/manual setup, unless the family entry explicitly documents a temporary API blocker.
  - Script-contract examples are allowed only when they exercise beta or diagnostic capabilities not yet expressible in the YAML runner.
  - Trajectory stores, raw run folders, proprietary COMSOL binaries, and old diagnostic archaeology stay out of public PhAST.
  - Visual examples must publish lightweight PNG/GIF/MP4 evidence plus a visual_manifest.json when generated by a runner.
  - Mesh-based public examples should include `mesh.geo`; diagnostic or non-geometric examples should not invent a mesh recipe.

tiers:
  - id: yaml_first
    status: public
    command: python -m phast run <config.yaml>
    contract: README.md plus config.yaml plus lightweight promoted outputs.
    public_gallery: true
  - id: script_contract
    status: beta
    command: python <run.py> --output-dir <dir>
    contract: README.md/config.yaml/run.py plus run_manifest.json and visual_manifest.json when visuals are generated.
    public_gallery: true
  - id: diagnostic
    status: developer_only
    command: case_specific
    contract: Developer evidence only; do not promote as a public example without a manifest update.
    public_gallery: false

