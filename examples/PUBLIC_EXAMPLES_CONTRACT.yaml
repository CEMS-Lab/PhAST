    kind: plasticity
    tutorial_ready: false
    tutorial_blockers:
    - Script-contract beta workflow; not yet a flat YAML-first tutorial folder.
    - Needs fluent/YAML promotion plus trajectory and animation bundle.
    workflow_entrypoint: configs/benchmarks/plasticity_interface/reproducibility_contracts.yaml
    workflow_command: python -m phast run configs/benchmarks/plasticity_interface/reproducibility_contracts.yaml --validation-id j2_validation
