schema_version: 1
manifest_type: command_manifest
description: >
  Reproducible single-case Miehe shear (SENS) peak-window verification.
  Uses PETSc/MUMPS mechanics and PhaseFieldX-style nonconvergence policy.

common_args:
  - --device
  - cpu
  - --plots
  - --profile
  - --trajectory
  - --trajectory_format
  - zarr
  - --gif
  - --animation_format
  - mp4
  - --gif_frames
  - 70
  - --newton_line_search
  - --line_search_max_steps
  - 10
  - --checkpoint_every
  - 1
  - --stagger_nonconvergence_policy
  - phasefieldx

cases:
  - label: sens_phasefieldx_peak_repro
    module: examples.quasistatic.miehe_shear.run
    compare: examples/quasistatic/miehe_shear/compare.py
    compare_args:
      - --reference-tier
      - phasefieldx-parity
    args:
      - --num_steps
      - 92
      - --h_crack
      - 0.005
      - --l0
      - 0.06
      - --stagger_tol
      - 1e-6
      - --max_stagger
      - 500
      - --backend
      - mumps
      - --preconditioner
      - jacobi
      - --adaptive_load_steps
      - --damage_refine_trigger
      - 0.10
      - --damage_increment_limit
      - 0.025
      - --min_load_step
      - 1e-5
      - --max_cutbacks
      - 40
      - --residual_cutback_limit
      - 5e-5
      - --energy_jump_limit
      - 0.50
