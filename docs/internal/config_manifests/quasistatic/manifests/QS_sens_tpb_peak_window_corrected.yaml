schema_version: 1
manifest_type: command_manifest
# STATUS: active bounded displacement-control artifact manifest.
# These SENS/TPB cases intentionally stop on the stable branch before the
# brittle snap-back zone that has repeatedly consumed multi-hour CPU jobs
# without producing complete artifacts. Strict peak and post-peak validation
# belongs to the arc-length manifest.
description: >
  Corrected quasi-static SENS/TPB bounded displacement-control cases with
  complete visualisation outputs. SENS covers the stable pre-peak branch
  against the shipped reference without entering the long unstable tail. TPB
  covers the stable pre-peak branch up to the last consistently accepted
  displacement before snap-back. These cases use the rate-independent damage
  equation, PETSc/MUMPS sparse-direct mechanics, and an explicit pre-peak
  comparison gate. Full peak/post-peak recovery is handled by the arc-length
  validation track.

common_args:
  - --device
  - cpu
  - --plots
  - --profile
  - --trajectory
  - --trajectory_format
  - zarr
  - --gif
  - --animation_format
  - mp4
  - --gif_frames
  - 70
  - --newton_line_search
  - --line_search_max_steps
  - 10
  - --checkpoint_every
  - 1
  - --stagger_nonconvergence_policy
  - phasefieldx

cases:
  - label: sens_bounded_prepeak
    module: examples.quasistatic.miehe_shear.run
    compare: examples/quasistatic/miehe_shear/compare.py
    compare_args:
      - --reference-tier
      - miehe-paper
      - --prepeak-only
    purpose: >
      Cover the stable SENS pre-peak branch with the corrected
      rate-independent damage solve and stop before the long unstable tail.
    expected_artifacts:
      - initial_conditions.png
      - load_displacement.png
      - damage_final.png
      - crack_path_stages.png
      - compare.png
      - compare_report.txt
      - damage_evolution.gif
      - training_data.zarr
      - history.csv
      - load_step_control.csv
      - run_metadata.json
      - case.yaml
    args:
      - --num_steps
      - 88
      - --h_crack
      - 0.005
      - --l0
      - 0.06
      - --stagger_tol
      - 1e-6
      - --max_stagger
      - 500
      - --static_max_iter
      - 500
      - --backend
      - mumps
      - --preconditioner
      - jacobi
      - --adaptive_load_steps
      - --damage_refine_trigger
      - 0.10
      - --damage_increment_limit
      - 0.025
      - --min_load_step
      - 1e-5
      - --max_cutbacks
      - 40
      - --residual_cutback_limit
      - 5e-5
      - --energy_jump_limit
      - 0.50

  - label: tpb_bounded_prepeak
    module: examples.quasistatic.three_point_bending.run
    compare: examples/quasistatic/three_point_bending/compare.py
    compare_args:
      - --prepeak-only
    purpose: >
      Cover the stable TPB pre-peak branch with capped stagger work. This is
      a displacement-controlled artifact gate, not an arc-length/post-peak
      continuation run.
    expected_artifacts:
      - initial_conditions.png
      - load_displacement.png
      - damage_final.png
      - crack_path_stages.png
      - compare.png
      - compare_report.txt
      - damage_evolution.gif
      - training_data.zarr
      - history.csv
      - load_step_control.csv
      - run_metadata.json
      - case.yaml
    args:
      - --num_steps
      - 62
      - --h_crack
      - 0.005
      - --l0
      - 0.06
      - --stagger_tol
      - 1e-5
      - --max_stagger
      - 1000
      - --static_max_iter
      - 500
      - --backend
      - mumps
      - --preconditioner
      - jacobi
      - --adaptive_load_steps
      - --damage_refine_trigger
      - 0.10
      - --damage_increment_limit
      - 0.08
      - --min_load_step
      - 1e-5
      - --max_cutbacks
      - 24
      - --residual_cutback_limit
      - 2e-4
      - --energy_jump_limit
      - 0.75
