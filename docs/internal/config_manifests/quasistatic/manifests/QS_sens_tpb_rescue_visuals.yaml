schema_version: 1
manifest_type: command_manifest
# STATUS: active diagnostic orchestration manifest.
# This is not a complete `python -m phast run ...` problem config.
# It lists CLI cells for the QS SENS/TPB rescue visual Slurm workflow. The
# complete geometry/material/loading/BC/solver setup lives in the referenced
# benchmark driver modules and their generated per-run `case.yaml` files.
description: >
  Targeted quasi-static SENS/TPB rescue validation cases with complete
  visualization outputs. These cases are intentionally peak-focused:
  SENS continues several increments after full crack development, and
  TPB stops just past the PhaseFieldX reference peak rather than chasing
  displacement-controlled snap-back. The benchmark CLIs write
  training_data.zarr by default; legacy H5 is only requested explicitly.
  The production rescue set uses the staggered quasistatic path. Monolithic
  SENS/TPB diagnostics were removed after job 38644 because both failed before
  any accepted step with non-finite coupled states and nonlinear
  non-convergence, so they are not valid benchmark or visualization cases.
  This rescue pass uses a mild implicit damage-viscosity diagnostic
  (`--damage_viscosity 1e-4`) to test whether bounded damage-rate
  regularisation can traverse the near-peak crack-growth window. The default
  solver remains rate-independent when this flag is omitted.

common_args:
  - --device
  - cpu
  - --plots
  - --profile
  - --trajectory
  - --trajectory_format
  - zarr
  - --gif
  - --animation_format
  - mp4
  - --gif_frames
  - 90
  - --newton_line_search
  - --line_search_max_steps
  - 10
  - --checkpoint_every
  - 1
  - --stagger_nonconvergence_policy
  - phasefieldx

cases:
  - label: sens_phasefieldx_viscous_postcrack
    module: examples.quasistatic.miehe_shear.run
    compare: examples/quasistatic/miehe_shear/compare.py
    compare_args:
      - --reference-tier
      - phasefieldx-parity
    purpose: >
      Cover the SENS PhaseFieldX-output reference peak and capture crack-stage
      snapshots after full crack development without running the full unstable
      post-peak tail. This is not the Miehe-paper 0.531 kN gate.
    expected_artifacts:
      - initial_conditions.png
      - load_displacement.png
      - damage_final.png
      - crack_path_stages.png
      - compare.png
      - compare_report.txt
      - damage_evolution.gif
      - training_data.zarr
      - history.csv
      - load_step_control.csv
      - run_metadata.json
      - case.yaml
    args:
      - --num_steps
      - 130
      - --h_crack
      - 0.005
      - --l0
      - 0.06
      - --stagger_tol
      - 1e-6
      - --max_stagger
      - 500
      - --backend
      - auto
      - --preconditioner
      - jacobi
      - --damage_viscosity
      - 1e-4
      - --adaptive_load_steps
      - --damage_refine_trigger
      - 0.10
      - --damage_increment_limit
      - 0.025
      - --min_load_step
      - 1e-5
      - --max_cutbacks
      - 40
      - --residual_cutback_limit
      - 5e-5
      - --energy_jump_limit
      - 0.50
      - --stop_at_crack
      - --stop_after_crack_steps
      - 8

  - label: tpb_peak_viscous_visuals
    module: examples.quasistatic.three_point_bending.run
    compare: examples/quasistatic/three_point_bending/compare.py
    purpose: >
      Reach u=0.0396 mm, just past the TPB reference peak at u=0.03898 mm,
      while avoiding the snap-back tail that requires arc-length continuation.
    expected_artifacts:
      - initial_conditions.png
      - load_displacement.png
      - damage_final.png
      - crack_path_stages.png
      - compare.png
      - compare_report.txt
      - damage_evolution.gif
      - training_data.zarr
      - history.csv
      - load_step_control.csv
      - run_metadata.json
      - case.yaml
    args:
      - --num_steps
      - 72
      - --h_crack
      - 0.005
      - --l0
      - 0.06
      - --stagger_tol
      - 1e-6
      - --max_stagger
      - 1000
      - --backend
      - auto
      - --preconditioner
      - jacobi
      - --damage_viscosity
      - 1e-4
      - --adaptive_load_steps
      - --damage_refine_trigger
      - 0.10
      - --damage_increment_limit
      - 0.025
      - --min_load_step
      - 1e-5
      - --max_cutbacks
      - 40
      - --residual_cutback_limit
      - 5e-5
      - --energy_jump_limit
      - 0.50

  - label: tpb_peak_loose_viscous_visuals
    module: examples.quasistatic.three_point_bending.run
    compare: examples/quasistatic/three_point_bending/compare.py
    purpose: >
      Peak-window TPB rescue with capped stagger work. This case is intended
      to cross the reference peak displacement after the strict adaptive run
      stalled at u=0.0386 mm with already-good force, pre-peak L2, and energy
      errors. It is a displacement-controlled validation gate, not an
      arc-length/post-peak continuation run.
    expected_artifacts:
      - initial_conditions.png
      - load_displacement.png
      - damage_final.png
      - crack_path_stages.png
      - compare.png
      - compare_report.txt
      - damage_evolution.gif
      - training_data.zarr
      - history.csv
      - load_step_control.csv
      - run_metadata.json
      - case.yaml
    args:
      - --num_steps
      - 70
      - --h_crack
      - 0.005
      - --l0
      - 0.06
      - --stagger_tol
      - 1e-5
      - --max_stagger
      - 300
      - --backend
      - auto
      - --preconditioner
      - jacobi
      - --damage_viscosity
      - 1e-4
      - --adaptive_load_steps
      - --damage_refine_trigger
      - 0.10
      - --damage_increment_limit
      - 0.08
      - --min_load_step
      - 1e-5
      - --max_cutbacks
      - 24
      - --residual_cutback_limit
      - 2e-4
      - --energy_jump_limit
      - 0.75
