schema_version: 1
manifest_type: command_manifest
description: >
  Reproducible single-case Miehe SENT tension setup used for local clean verification
  and paper-sized smoke checks. The default outputs are Zarr, MP4, plots, and CSV
  diagnostics so each rerun is directly auditable.

common_args:
  - --device
  - cpu
  - --plots
  - --profile
  - --trajectory
  - --trajectory_format
  - zarr
  - --gif
  - --animation_format
  - mp4
  - --gif_frames
  - 60
  - --backend
  - auto
  - --preconditioner
  - jacobi
  - --checkpoint_every
  - 1

cases:
  - label: sent_at2_repro
    module: examples.quasistatic.miehe_tension.run
    compare: examples.quasistatic.miehe_tension.compare.py
    args:
      - --at_mode
      - at2
      - --h_crack
      - 0.003
      - --l0
      - 0.015
      - --num_steps
      - 150
      - --stagger_tol
      - 1e-6
      - --max_stagger
      - 1000
      - --adaptive_load_steps
      - --damage_refine_trigger
      - 0.30
      - --damage_increment_limit
      - 0.025
      - --min_load_step
      - 1.25e-6
      - --max_cutbacks
      - 40
      - --residual_cutback_limit
      - 5e-5
      - --energy_jump_limit
      - 0.50
