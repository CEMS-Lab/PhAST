name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public unit and onboarding tests
        run: python -m pytest -q tests

      - name: Report selected solver route
        run: python -m phast doctor

      - name: Validate representative configurations
        shell: bash
        run: |
          python -m phast run examples/dynamic/B2_kalthoff_winkler/config.yaml --validate-only
          python -m phast run examples/solid_mechanics_beta/linear_plate/config.yaml --validate-only

  supported-python-range:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public unit and onboarding tests
        run: python -m pytest -q tests
