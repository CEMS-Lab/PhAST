name: wheels
# Trigger policy:
#   - workflow_dispatch: manual wheel build ("gh workflow run wheels.yml")
#   - v* tags: build wheels + sdist, smoke-test linux wheel, then publish to PyPI
# No auto-fire on branch pushes, PRs, or schedules.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    name: source-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build:
    name: ${{ matrix.os }}-${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]  # macos-14 = arm64
        python: ['cp310', 'cp311', 'cp312']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.21.3
      - name: Build wheel
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64
          # Don't try to install heavy backend deps inside the wheel build — keep it
          # to the default install. PETSc/cuDSS are user-side optional.
          CIBW_BEFORE_BUILD: pip install --upgrade pip
          CIBW_TEST_COMMAND: python -c "from phast.sparse_solve import solve; from phast.time_integrators import gen_alpha_params; print('OK')"
        run: cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-test:
    name: Verify wheels install cleanly
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install + smoke test
        run: |
          pip install wheelhouse/*linux*cp311*.whl
          python -c "from phast.sparse_solve import solve; from phast.time_integrators import gen_alpha_step; print('linux-x86_64 wheel OK')"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, sdist, publish-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish wheels and sdist
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
