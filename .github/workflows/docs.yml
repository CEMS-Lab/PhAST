name: docs
# Build and publish documentation after changes reach main; retain a manual
# trigger for maintainers.
# Run the same strict build locally before documentation PRs:
#   PHAST_NB_EXECUTION_MODE=force sphinx-build -W -b html docs docs/_build/html
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gmsh
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install -r requirements-docs.txt
      - name: Build
        run: |
          sphinx-build -W -b html docs docs/_build/html
        env:
          PHAST_COMMIT: ${{ github.sha }}
          PHAST_NB_EXECUTION_MODE: force
      - name: Check external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sphinx-build -W -b linkcheck docs docs/_build/linkcheck
      - name: Add Google Search Console verification file
        run: |
          echo 'google-site-verification: google30a959a56f7fae1d.html' > docs/_build/html/google30a959a56f7fae1d.html
      - name: Verify sitemap
        run: |
          test -f docs/_build/html/sitemap.xml || { echo "Missing docs/_build/html/sitemap.xml"; exit 1; }
          grep -q "cems-lab.github.io/PhAST" docs/_build/html/sitemap.xml || { echo "sitemap missing PhAST canonical host"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
