name: install-promise
# Trigger policy (2026-06-02): manual-only.
#   - workflow_dispatch: manual ("gh workflow run install-promise.yml")
# No auto-fire on push, PR, or schedule while install checks are run manually.
on:
  workflow_dispatch:

concurrency:
  group: install-promise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system libraries (Gmsh needs libGLU)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 libegl1 libxcursor1 libxinerama1

      - name: Fresh install (default deps only, no extras)
        run: |
          python -m pip install --upgrade pip
          echo "::group::pip install -e . (timed)"
          { time pip install -e . ; } 2>&1 | tail -20
          echo "::endgroup::"
          pip install pytest

      - name: Verify core imports
        run: |
          python -c "from phast.sparse_solve import solve, SparseSolveAutograd; print('sparse_solve OK')"
          python -c "from phast.time_integrators import gen_alpha_step; print('time_integrators OK')"
          python -c "from phast.mixed_precision_cg import cg_mixed_precision; print('mixed_precision_cg OK')"

      - name: Run tests (default deps, not slow)
        run: |
          pytest tests/ -q --tb=short -m 'not slow'
