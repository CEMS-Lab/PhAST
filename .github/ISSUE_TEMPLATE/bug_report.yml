name: Bug report
description: Report an incorrect result, crash, regression, or broken workflow.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, YAML config, mesh, and smallest input that reproduces the issue.
      value: |
        ```bash
        # command here
        ```
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, torch, device, dtype, optional solver backends, and git commit.
      value: |
        - OS:
        - Python:
        - torch:
        - device/dtype:
        - optional backends:
        - commit:
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Relevant Outputs
      description: Attach small logs, compare reports, screenshots, or CSV snippets. Keep raw HPC/Zarr/H5 bundles off GitHub unless requested.
    validations:
      required: false

