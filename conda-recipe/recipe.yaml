schema_version: 1

context:
  name: phast
  version: "0.16.2"  # from pyproject.toml; bump on release

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Switch to a release tarball before submission, e.g.:
  #   url: https://github.com/CEMS-Lab/PhAST/archive/v${{ version }}.tar.gz
  #   sha256: <fill-in-after-tagging>
  # The git+rev form is allowed for staged-recipes review but a tagged
  # tarball is strongly preferred by conda-forge maintainers.
  git: https://github.com/CEMS-Lab/PhAST
  rev: v${{ version }}  # CREATE TAG before submission

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
  run:
    - python >=3.10
    - pytorch >=2.0
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.6
    - h5py >=3.7
    - meshio >=5.0
    - python-gmsh >=4.10
    - pillow >=9.0
    - pyyaml >=6.0
    - pyamg
    - pymetis
    - petsc4py
    - mumps

tests:
  - python:
      imports:
        - phast
        - phast.sparse_solve
        - phast.time_integrators
        - phast.mixed_precision_cg
        - phast.research.process_zone
        - phast.adaptive
      pip_check: true

about:
  homepage: https://github.com/CEMS-Lab/PhAST
  documentation: https://cems-lab.github.io/PhAST/
  repository: https://github.com/CEMS-Lab/PhAST
  summary: PhAST, the Phase-field Autograd Solver in Torch
  description: |
    PhAST is a vectorized, GPU-compatible FEM solver for AT1/AT2
    phase-field fracture on unstructured triangular meshes. Key features:
      - Native PyTorch tensor kernels through the validated AT2 forward workflows
      - SciPy SuperLU plus optional PETSc/MUMPS and CuPy sparse-direct backends
      - Hulbert-Chung generalized-alpha time integrator
      - Mixed-precision CG with iterative refinement
      - Verified on Miehe SENT/SENS phase-field benchmarks
    Optional extras (PyAMG, PyMETIS, CuPy, PETSc/MUMPS) are installed as
    separate conda packages, e.g.:
      conda install -c conda-forge phast pyamg pymetis petsc4py mumps
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - allamaprabhuani
