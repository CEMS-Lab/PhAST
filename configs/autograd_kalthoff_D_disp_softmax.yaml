schema_version: 1
# Autograd Kalthoff inversion — ablation variant D (all fixes):
# displacement loss + smooth-max H (β=50) + damage_every=1
# Reference configuration from the ablation study.
# Best-case scenario for autograd to converge on production Kalthoff.

example: phast.inverse_kalthoff_stanic.demo_autograd_kalthoff

problem:
  name: "Autograd Kalthoff inversion — D (disp loss + smooth max)"

geometry:
  parameters:
    h_crack: 1.0
    h_coarse: 6.0

loading:
  t_total: 60.0          # microseconds (demo uses µs)

solver:
  device: cuda

inversion:
  n_iters: 20
  params: Gc_l0
  loss: displacement
  softmax_H_beta: 50.0
