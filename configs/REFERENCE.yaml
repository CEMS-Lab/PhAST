# ============================================================================
# AVAILABLE POST-PROCESSING RESULT FIELDS
# ============================================================================
# These can be used in gif_fields (comma-separated) and are computed
# automatically when H5 or VTU output is enabled:
#
# Stress:       stress_xx, stress_yy, stress_xy, von_mises_stress,
#               hydrostatic_stress, stress_triaxiality,
#               max_principal_stress, min_principal_stress
# Strain:       strain_xx, strain_yy, strain_xy, von_mises_strain,
#               max_principal_strain, min_principal_strain
# Phase-field:  damage, H (history variable)
# Energy:       elastic_energy, fracture_energy, kinetic_energy (in H5)

# ============================================================================
# AVAILABLE VIA PYTHON API (not YAML)
# ============================================================================
# Fracture:     J-integral, K_I/K_II via compute_j_integral() / compute_sif()
# Mesh import:  geometry: {mesh_path: "my_mesh.inp"} — Abaqus/Nastran/VTU
# Elastic only: solver: {enable_damage: false}
# Adaptive dt:  solver: {adaptive_dt: true, adaptive_dt_d_threshold: 0.01}
#
# NOT YET SUPPORTED
# ============================================================================
# BC types:     periodic, pressure (normal traction), contact
# Elements:     T6 (quadratic), Q4/Q8 (quads), T4 (3D tetrahedra)
# Time:         implicit dynamics (HHT-alpha)
# ============================================================================
