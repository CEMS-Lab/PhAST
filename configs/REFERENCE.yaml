# ============================================================================
# FULL YAML REFERENCE — Every available option for phast
# ============================================================================
#
# This file documents ALL configurable options. Copy it, delete sections
# you don't need, and fill in your values. Defaults are shown in comments.
#
# Run with:
#   python -m phast run my_problem.yaml
#   python -m phast run my_problem.yaml --device cuda --fast
#
# CLI flags override YAML values. See configs/README.md for precedence.
#
# ----------------------------------------------------------------------------
# THIS FILE IS AUTO-GENERATED — DO NOT HAND-EDIT
# ----------------------------------------------------------------------------
# Source: phast config dataclasses plus enum/range validation tables.
# Regenerate with the project release tooling when schema tables change.
#
# ----------------------------------------------------------------------------
# UNITS — reference convention (issue #141)
# ----------------------------------------------------------------------------
# The solver runs in a single, *consistent* unit system driven by the
# mesh generators (which produce millimetre coordinates). All bare
# numeric values in this YAML are interpreted in those internal units:
#
#     length    : mm
#     mass      : tonne (= 1000 kg)
#     time      : s
#     force     : N           (= tonne * mm / s^2)
#     stress    : MPa         (= N / mm^2)
#     density   : tonne/mm^3
#     Gc        : N/mm        (= kJ/m^2 = 1000 J/m^2)
#     traction  : N/mm        (2D boundary force per unit length)
#     velocity  : mm/s        (impact velocities given in m/s are *1e3)
#
# For ergonomics, **string-quoted SI suffixes** are accepted on every
# material override and on ``loading.{t_total, dt, t_ramp, v0, disp_max,
# prestrain_displacement}``, plus boundary-condition displacement,
# traction, and ramp-time fields. They are normalised to the internal
# unit at load time. Bare floats are *unchanged* (status-quo for legacy
# configs).  Examples:
#
#   material:
#     overrides:
#       E:    "32 GPa"        # equivalent to E: 32000.0    (MPa)
#       Gc:   "3 J/m^2"       # equivalent to Gc: 3.0e-3    (N/mm)
#       l0:   "0.25 mm"       # equivalent to l0: 0.25
#       rho:  "2450 kg/m^3"   # equivalent to rho: 2.45e-9  (tonne/mm^3)
#
#   loading:
#     t_total: "80 us"        # equivalent to 80.0e-6       (s)
#     v0:      "16.5 m/s"     # equivalent to 16.5          (m/s — legacy)
#                             # NB: loading.v0 is the only field whose reference
#                             # unit is m/s (not internal mm/s); it is multiplied
#                             # by 1e3 inside compute_load_factor at runtime.
#
#   boundary_conditions:
#     - {nodes: top, type: prescribe, component: 1, value: "0.01 mm"}
#     - {nodes: right, type: traction, component: 1, value: "1 MPa",
#        ramp_type: smooth_step, t_ramp: "10 us"}
#                             # traction is stored as N/mm. Stress suffixes
#                             # assume unit out-of-plane thickness.
#
# Supported suffixes (see phast/units.py for the complete list):
#   stress    : Pa, kPa, MPa, GPa, N/mm^2
#   Gc        : N/mm, kN/mm, J/m^2, kJ/m^2, N/m, kN/m
#   length    : nm, um (μm), mm, cm, m
#   density   : kg/m^3, g/cm^3, g/mm^3, tonne/mm^3
#   traction  : N/mm, kN/mm, N/m, kN/m, Pa, kPa, MPa, GPa, N/mm^2
#   time      : ns, us (μs), ms, s
#   velocity  : mm/s, cm/s, m/s, km/s, mm/us, m/ms
# ============================================================================

# ---------- Problem metadata ----------
schema_version: 1                         # Config schema version for migrations
problem:
  name: "My Problem"                     # Display name (free text)
  reference: ""                          # Citation (e.g., "Borden et al. (2012)")

# ---------- Acceptance metadata ----------
# Optional but recommended for benchmark validation configs.
# This structured but extensible block records what a correct run must
# reproduce. Keep numerical tolerances explicit and list all required
# artifacts so HPC submissions and post-processing scripts can be audited
# without hunting through papers or notebooks. Standard fields are validated;
# custom benchmark-specific keys are preserved.
acceptance:
  status: scaffold                       # scaffold | beta | production | validated | diagnostic | experimental
  reference_result: ""                   # DOI/report/table/figure used as target
  required_outputs: [run_lockfile.json, config.yaml]
  metrics:
    peak_force:
      target: null
      tolerance: null
      units: N
    crack_path:
      target: qualitative
      tolerance: visual
  notes: ""                              # Known caveats or acceptance context

# ---------- Mesh generation ----------
# The 'type' selects a generator function from mesh_generator.py.
# All parameters are passed as keyword arguments to that function.
geometry:
  type: rectangular_sent                 # REQUIRED — see table below
  parameters:
    # --- Common to most generators ---
    W: 100.0                             # Domain width [mm]
    H: 40.0                              # Domain height [mm]
    a: 50.0                              # Notch length [mm]
    h_crack: 0.5                         # Element size at crack tip [mm]
    h_coarse: 4.0                        # Element size far from crack [mm]
    # --- Generator-specific ---
    branching: false                     # rectangular_sent: wider crack band for branching
    # rectangular_sent_comsol_structured  # COMSOL B7 half-plate mapped-grid split-quad diagnostic
    # theta: 45.0                        # kalthoff_winkler: notch angle [deg]
    # hole_config: "30holes"             # perforated_sent: hole layout name
    # L: 1.0                             # miehe_tension/shear: square side [mm]

# Available geometry types:
#   bazant_gap_test
#   glass_impact_vnotch
#   kalthoff_winkler
#   l_shaped_panel
#   miehe_shear
#   miehe_tension
#   perforated_sent
#   plate_with_holes
#   rectangular_sent
#   rectangular_sent_comsol_structured
#   rectangular_sent_liu_structured
#   rectangular_sent_q4_structured
#   square_plate
#   three_point_bending

# ---------- Geometry: declarative primitive vocabulary + boolean ops -------
# Phase 2.1 (#142) introduces a declarative alternative to the built-in
# generators above: name your primitives in YAML, then (Phase 2.2, #143)
# compose them via boolean ops to define the computational domain.
# Mutually exclusive with `geometry.type`. The compiler that turns this
# into a mesh lands in #146; for now this block is parsed + validated
# but raises NotImplementedError at resolve time.
#
# geometry:
#   units: mm                              # mm (default) | m
#   primitives:
#     plate:    { type: rectangle, origin: [0, 0],     size: [65, 120] }
#     notch:    { type: rectangle, origin: [0, 64.75], size: [10, 0.5] }
#     big_hole: { type: circle,    center: [36.5, 51], radius: 10 }
#     pin_top:  { type: circle,    center: [20, 100],  radius: 5 }
#     pin_bot:  { type: circle,    center: [20, 20],   radius: 5 }
#   domain:
#     base: plate                          # REQUIRED — primitive that seeds the tree
#     subtract: [notch, big_hole, pin_top, pin_bot]   # OCC BooleanDifference
#     add: []                              # OCC BooleanUnion (default [])
#     intersect: []                        # OCC BooleanIntersection (default [])

# ---------- Material ----------
#
# Two equivalent ways to specify a material — pick whichever is cleaner.
#
# (A) INLINE form (recommended for new problems, no preset required):
#
#     material:
#       E: 32000.0                       # Young's modulus [MPa]
#       nu: 0.2                          # Poisson's ratio
#       Gc: 3.0e-3                       # Fracture toughness [N/mm = kJ/m^2]
#       l0: 0.25                         # Regularisation length [mm]
#       rho: 2.45e-9                     # Density [tonne/mm^3] (explicit dyn.)
#       energy_split: spectral           # spectral | amor | isotropic | star_convex
#       pf_model: AT2                    # AT2 | AT1
#       plane_stress: false              # true | false (plane strain)
#       eta_residual: 1.0e-7             # Residual stiffness in degradation
#
# (B) LEGACY preset+overrides form (still fully supported):
#
#     material:
#       preset: glass_borden
#       overrides:
#         l0: 0.5
#         energy_split: spectral
#
# Resolution order when both are present (highest priority last):
#   preset values  <  overrides dict  <  inline top-level fields
#
# Full schema (auto-derived) for the inline material fields:
#   E: null  # float or null
#   nu: null  # float or null
#   Gc: null  # float or null
#   l0: null  # float or null
#   rho: null  # float or null
#   eta_residual: null  # float or null
#   energy_split: null  # str or null
#   pf_model: null  # str or null
#   kinematics: null  # str or null
#   plane_stress: null  # bool or null
#   driving_force: null  # str or null
#   cubic_s: null  # float or null
#   sigma_ts: null  # float or null
#   pfczm_p: null  # int or null
#   pfczm_softening: null  # str or null
#
# Allowed values for legacy ``material.overrides`` enum keys:
#   energy_split  # enum: spectral|spectral_stress|amor|volumetric_deviatoric|star_convex|isotropic
#   pf_model  # enum: AT1|AT2|PFCZM|allencahn
#   driving_force  # enum: strain_energy|principal_stress
#   pfczm_softening  # enum: linear|exponential
#   l0  # float, range: [0.0, +inf]
#   Gc  # float, range: [0.0, +inf]
#   E  # float, range: [0.0, +inf]
#   nu  # float, range: [-1.0, 0.5]
#   rho  # float, range: [0.0, +inf]
#   eta_residual  # float, range: [0.0, +inf]
#   sigma_ts  # float, range: [0.0, +inf]
#   pfczm_p  # float, range: [2, +inf]
#
# The example below uses the legacy form so the rest of this REFERENCE
# stays runnable; switch to inline whenever you prefer.
material:
  preset: glass_borden                   # Optional — omit for fully-inline material
  overrides:                             # Optional: legacy override layer
    l0: 0.5                              # Regularisation length [mm]
    energy_split: spectral               # spectral | amor | isotropic
    pf_model: AT2                        # AT2 | AT1
    # at1_threshold: auto                # AT1-only: strain-energy source S_H in
                                         # the damage RHS (2H − S_H). 'auto'
                                         # (default) computes S_H = 3 Gc/(8 l0)
                                         # following Pham 2011 / Tanné 2018 /
                                         # Bleyer 2017 / COMSOL Eq. 6 — gives
                                         # an elastic threshold for damage onset
                                         # at W_c0 = S_H/2 = 3 Gc/(16 l0).
                                         # Provide a float to override.
                                         # Ignored when pf_model == 'AT2'.
    # --- Bare floats: internal units (reference) ---
    # E: 32000.0                         # Young's modulus [MPa]   (== 32 GPa)
    # nu: 0.2                            # Poisson's ratio
    # Gc: 3.0e-3                         # Fracture toughness [N/mm]   (== 3 J/m^2)
    # rho: 2.45e-9                       # Density [tonne/mm^3]    (== 2450 kg/m^3)
    # eta_residual: 1.0e-7               # Residual stiffness in degradation (default; #272)
    # plane_stress: false                # true for plane stress, false for plane strain
    # --- Equivalent SI-string forms (issue #141) ---
    # E: "32 GPa"
    # Gc: "3 J/m^2"
    # l0: "0.25 mm"
    # rho: "2450 kg/m^3"

  # --- Inline overrides (highest priority, win over preset+overrides) ---
  # E: 32000.0
  # l0: 0.25

# Available material presets:
# +---------------------+----------+--------+----------+-----------------------+
# | preset              | Material | E GPa  | Gc kJ/m2 | Source                |
# +---------------------+----------+--------+----------+-----------------------+
# | glass_borden        | Glass    |  32    | 3e-3     | Borden et al. (2012)  |
# | maraging_steel_kw   | Steel    | 190    | 22.2e-3  | Kalthoff-Winkler      |
# | pmma_bleyer         | PMMA     |   3.09 | 0.3e-3   | Bleyer et al. (2017)  |
# | miehe_tension       | Generic  | 210    | 2.7e-3   | Miehe et al. (2010)   |
# | miehe_shear         | Generic  | 210    | 2.7e-3   | Miehe et al. (2010)   |
# | steel_pf            | Steel    | 210    | 2.7e-3   | Generic PF steel      |
# | l_shaped_concrete   | Concrete |  25.85 | 0.095e-3 | Winkler (2001)        |
# | soda_lime_glass     | Glass    |  72    | 8e-6     | Standard              |
# | pmma                | PMMA     |   5.76 | 0.32e-3  | Standard              |
# | three_point_bending | Concrete |  20.8  | 0.113e-3 | Literature            |
# | alumina_kumar       | Alumina  | 340    | 0.026e-3 | Kumar et al.          |
# | brittle_ceramic     | Ceramic  | 300    | 0.02e-3  | Generic               |
# | l_shaped_glass      | Glass    |  72    | 8e-6     | Standard              |
# +---------------------+----------+--------+----------+-----------------------+

# ---------- Boundary conditions ----------
# Each entry applies to a named node set from the mesh generator.
# Available node sets depend on geometry (typically: left, right, top, bottom,
# notch_upper, notch_lower; Kalthoff adds impact_zone; perforated adds hole_*).
#
# Types:
#   fix             — homogeneous Dirichlet (u=0)
#   prescribe       — inhomogeneous Dirichlet (u=value, scaled by load_factor)
#   neumann         — traction (force per unit length, constant; legacy)
#   traction        — traction with explicit ramp_type/t_ramp/t_hold
#   symmetry        — homogeneous Dirichlet on the normal component of an edge
#                     (shorthand for `fix component=<axis>`). axis names the
#                     suppressed component: an edge parallel to x has
#                     axis=y (fix v=0); parallel to y has axis=x (fix u=0).
#   rigid_connector — Full master/slave rigid-body MPC (issue #154). The
#                     master gets a free rotation DOF and slave nodes are
#                     tied via the linearised rigid-body constraint
#                     u_slave = u_master + theta x (X_slave - X_master).
#                     Default ``rotation_free: true``; set
#                     ``rotation_free: false`` to recover the legacy
#                     "welded" behaviour shipped in #155 (every slave +
#                     master locked to the master's prescribed translation,
#                     no rotation freedom).
#                     Currently active in the static path
#                     (DirectSolver / SecantCGSolver); explicit-dynamic
#                     still uses the welded fallback.
#
# component: 0 = x, 1 = y
# value units:
#   prescribe       — displacement [mm]; accepts length suffixes
#   neumann/traction — boundary traction [N/mm]; accepts force-per-length
#                      suffixes, and stress suffixes such as MPa with unit
#                      out-of-plane thickness
#   pf_dirichlet    — dimensionless damage value; do not attach units
#
# traction ramp_type vocabulary (per-BC, independent of the global
# loading.ramp_type which scales Dirichlet BCs):
#   constant     — factor = 1 always (matches legacy 'neumann')
#   linear       — factor = clamp(t / t_ramp, 0, 1)
#   smooth_step  — factor = 3 s^2 - 2 s^3   (Hermite C1, COMSOL convention)
#   cosine       — factor = 0.5 * (1 - cos(pi * t / t_hold))
#
# Full schema (auto-derived) for each entry:
#   nodes: ""  # str
#   type: fix  # str, enum: fix|prescribe|neumann|traction|symmetry|rigid_connector|pf_dirichlet
#   component: 0  # int, enum: 0|1
#   value: 0.0  # float
#   ramp_type: constant  # str, enum: constant|linear|smooth_step|cosine
#   t_ramp: 0.0  # float
#   t_hold: null  # float or null
#   axis: null  # str or null, enum: x|y
#   master: null  # str or null
#   dofs: null  # list[str]
#   prescribe: null  # dict or null
#   rotation_free: true  # bool
boundary_conditions:
- {nodes: left,   type: fix,     component: 0}
- {nodes: top,    type: neumann, component: 1, value: "1 MPa"}
- {nodes: bottom, type: neumann, component: 1, value: "-1 MPa"}
# Examples (uncomment to use):
# - {nodes: bottom_edge, type: symmetry, axis: y}
# - {nodes: top_edge, type: traction, component: 1, value: "5 MPa",
#    ramp_type: smooth_step, t_ramp: "0.1 us"}
# - {nodes: pin_top.boundary, type: rigid_connector,
#    master: pin_top.centre, dofs: [x, y], prescribe: {y: "1 mm"},
#    rotation_free: true}    # default: full MPC with master rotation

# ---------- Loading ----------
#
# Protocols:
#   simple              — constant BCs (Neumann) or step load (Dirichlet)
#   two_step_prestrain  — quasi-static pre-strain, then dynamic release (PMMA branching)
#   cyclic              — schedule list from ``cyclic_phases`` string
#
# For time-varying Dirichlet BCs (displacement/velocity ramps):
#   Set t_ramp > 0. load_factor ramps linearly from 0 to 1 over t_ramp seconds,
#   then holds at 1. The prescribed BC value is multiplied by load_factor each step.
#   Example: prescribe top y=0.01 + t_ramp=10e-6 → displacement ramps to 0.01 mm in 10 µs.
#
# For constant traction (Neumann): t_ramp is not needed — force is constant from step 0.
loading:
  # protocol: simple  # str, enum: simple|two_step_prestrain|cyclic
  # ramp_type: constant  # str, enum: constant|linear|smooth|smooth_step|velocity_impact
  # num_steps: 100  # int, range: [0, +inf]
  # t_total: 0.0  # float, range: [0.0, +inf]
  # dt: 1e-05  # float, range: [0.0, +inf]
  # t_ramp: 0.0  # float, range: [0.0, +inf]
  # v0: 0.0  # float
  # disp_max: 0.0  # float
  # prestrain_displacement: 0.0  # float
  # coupled_prestrain: false  # bool
  # cyclic_phases: ""  # str

