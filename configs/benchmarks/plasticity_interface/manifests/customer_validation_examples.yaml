schema_version: 1
manifest_type: command_manifest
description: >
  Reproducible plasticity, cohesive, and contact validation commands. These
  examples use specialised sparse mechanics entry points rather than the
  generic YAML problem runner, so this manifest records command lines and
  acceptance evidence.

defaults:
  python: python
  working_directory: repository root
  backend_policy: >
    Use sparse quasi-static mechanics with backend auto where the example
    exposes a backend option. PETSc/MUMPS is preferred after a smoke test,
    SciPy SuperLU is the CPU fallback, and unsupported coupled material
    combinations must fail early.

cases:
  - id: sparse_j2_backend_promotion
    role: sparse J2 mechanics backend validation
    command:
      - python
      - examples/plasticity_interface/run_sparse_j2_backend_promotion.py
    expected_outputs:
      - backend summary
      - stress-strain or force-displacement plot
      - pass/fail summary

  - id: j2_material_point_validation
    role: J2 return-mapping validation
    command:
      - python
      - examples/plasticity_interface/run_j2_validation.py
    expected_outputs:
      - material-point comparison plots
      - numerical summary

  - id: ductile_pf_plasticity_guarded
    role: guarded ductile phase-field/plasticity coupling validation
    command:
      - python
      - examples/plasticity_interface/run_ductile_pf_plasticity_validation.py
    expected_outputs:
      - damage and plastic-work plots
      - energy ledger
      - validation summary

  - id: ductile_pf_sensitivity
    role: ductile phase-field/plasticity parameter sensitivity
    command:
      - python
      - examples/plasticity_interface/run_ductile_pf_sensitivity_study.py
    expected_outputs:
      - sensitivity plots
      - energy ledger
      - summary CSV or JSON

  - id: cohesive_mode_I_jump
    role: cohesive mode-I displacement-jump benchmark
    command:
      - python
      - examples/plasticity_interface/run_cohesive_displacement_jump_benchmark.py
    expected_outputs:
      - traction-separation plot
      - dissipated-energy check

  - id: cohesive_mixed_mode
    role: mixed-mode cohesive tangent benchmark
    command:
      - python
      - examples/plasticity_interface/run_cohesive_mixed_mode_benchmark.py
    expected_outputs:
      - mixed-mode traction plot
      - tangent finite-difference check

  - id: cohesive_contact_compression
    role: cohesive contact-compression benchmark
    command:
      - python
      - examples/plasticity_interface/run_cohesive_contact_compression_benchmark.py
    expected_outputs:
      - contact traction plot
      - zero-damage-growth check

  - id: cohesive_delamination_patch
    role: multi-element delamination patch benchmark
    command:
      - python
      - examples/plasticity_interface/run_cohesive_delamination_patch_benchmark.py
    expected_outputs:
      - delamination-front metrics
      - resultant-force check
      - damage-field visualisation

  - id: structural_dcb_cohesive
    role: DCB-style structural cohesive benchmark
    command:
      - python
      - examples/plasticity_interface/run_structural_dcb_cohesive_benchmark.py
    expected_outputs:
      - load-displacement curve
      - post-peak softening evidence
      - cohesive damage-front metrics

  - id: diffuse_interphase
    role: diffuse solid-interface validation
    command:
      - python
      - examples/plasticity_interface/run_diffuse_interphase_validation.py
    expected_outputs:
      - interphase field plots
      - summary metrics

  - id: solid_interface_fracture
    role: solid-interface fracture examples
    command:
      - python
      - examples/plasticity_interface/run_solid_interface_fracture_examples.py
    expected_outputs:
      - damage plots
      - solver summary
