      - summary.json
      - config.yaml
      - run_lockfile.json
      - run_metadata.json
      - run_manifest.json
      - run.log
      - results.csv
      - solver_telemetry.csv
      - backend_evidence.csv
      - damage_final.png
      - mesh_deformed.png
      - load_displacement.png
      - visual_manifest.json
    claim_boundary: Q4 sparse mechanics plus AT2 damage smoke; Q4 PF-CZM/plasticity/cohesive-coupled paths remain gated.

  - id: sparse_j2_backend_promotion
    family: backend_promotion
    script: examples/plasticity_interface_beta/run_sparse_j2_backend_promotion.py
    launcher:
      - python
      - examples/plasticity_interface_beta/run_sparse_j2_backend_promotion.py
      - --output-dir
      - outputs/plasticity_interface/sparse_j2_backend_promotion
