      - summary.json
      - config.yaml
      - run_lockfile.json
      - run_metadata.json
      - run_manifest.json
      - run.log
      - backend_promotion.csv
    claim_boundary: Backend availability and fallback evidence; cuDSS remains gated until it resolves without fallback.

  - id: ductile_pf_backend_promotion
    family: backend_promotion
    script: examples/plasticity_interface_beta/run_ductile_pf_backend_promotion.py
    launcher:
      - python
      - examples/plasticity_interface_beta/run_ductile_pf_backend_promotion.py
      - --output-dir
