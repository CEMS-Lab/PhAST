      - run_lockfile.json
      - run_metadata.json
      - run_manifest.json
      - run.log
      - mesh.geo
      - mesh.msh
      - results.csv
      - history.csv
      - solver_telemetry.csv
      - timing_per_step.csv
      - energy.csv
      - damage_final.png
      - load_displacement.png
      - damage_history.png
      - energy_split.png
      - convergence.png
      - mesh_deformed.png
      - damage_evolution.gif
      - visual_manifest.json
    claim_boundary: Forward Wu PF-CZM strength calibration smoke; structural crack growth and mixed-mode validation remain gated.

  - id: q4_sparse_at2_smoke
    family: q4_sparse_phase_field
    script: examples/plasticity_interface_beta/run_q4_sparse_at2_smoke.py
    launcher:
      - python
      - examples/plasticity_interface_beta/run_q4_sparse_at2_smoke.py
      - --output-dir
      - outputs/plasticity_interface/q4_sparse_at2_smoke
      - --nx
      - "32"
      - --ny
      - "16"
      - --n-steps
      - "5"
      - --backend
      - scipy
