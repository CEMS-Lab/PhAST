      - run.log
      - mesh.geo
      - mesh.msh
      - results.csv
      - history.csv
      - solver_telemetry.csv
      - timing_per_step.csv
      - energy.csv
      - cohesive_front.csv
      - initial_conditions.png
      - damage_final.png
      - cohesive_damage_front.png
      - load_displacement.png
      - energy_split.png
      - convergence.png
      - damage_evolution.gif
      - mesh_deformed.png
      - damage_history.png
      - visual_manifest.json
    claim_boundary: Coupled brittle AT2 matrix damage plus cohesive interface smoke; not calibrated PF-CZM or ductile PF-plasticity-cohesive.

  - id: pfczm_uniaxial_strength
    family: pfczm
    script: examples/plasticity_interface_beta/run_pfczm_uniaxial_strength_validation.py
    launcher:
      - python
      - examples/plasticity_interface_beta/run_pfczm_uniaxial_strength_validation.py
      - --output-dir
