schema_version: 1
example: phast.examples.dynamic_coalescence.run
problem:
  name: Crack Coalescence
  reference: Borden et al. (2012), CMAME
# Geometry: kept on the crack_coalescence generator. Two offset
# internal slits aren't expressible as rectangle/circle base/subtract
# in the current inline-primitive compiler (issue #147 scope note).
geometry:
  type: crack_coalescence
  parameters:
    W: 50.0
    H: 50.0
    h_crack: 0.5
    h_coarse: 4.0
# Inline material — Borden (2012) soda-lime glass.
material:
  E: 32000.0            # 32 GPa
  nu: 0.20
  Gc: 3.0e-3            # 3 J/m^2
  l0: 0.5
  rho: 2.45e-9
  energy_split: spectral
  pf_model: AT2
  eta_residual: 1.0e-7
boundary_conditions:
- nodes: left
  type: fix
  component: 0
- nodes: top
  type: prescribe
  component: 1
  value: 1.0
- nodes: bottom
  type: prescribe
  component: 1
  value: -1.0
loading:
  protocol: simple
  t_total: 5.0e-05
  ramp_type: linear
  t_ramp: 1.0e-06
solver:
  solver_type: explicit
  dt_safety: 0.8
output:
  h5: true
  h5_every: 20
  fast: true
  print_every: 100
