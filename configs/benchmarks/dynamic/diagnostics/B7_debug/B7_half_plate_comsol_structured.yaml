# =====================================================================
# B7 -- Dynamic crack branching, COMSOL mapped-mesh parity diagnostic.
#
# This is the strict COMSOL half-plate volDev/Amor setup with one targeted
# geometry change: use a structured mapped-grid split-quad triangular mesh.
# COMSOL's Application Library defines sample height=40 mm, then builds the
# symmetry-reduced rectangle with height/2 = 20 mm. The model uses mapped
# quads with h = l0/4. The torch solver remains P1-triangle based, so this
# config preserves the mapped node placement and boundary groups while
# splitting each quad into two T3s.
#
# Purpose:
#   Separate mesh-regularity effects from solver/formulation effects in the
#   B7 branching discrepancy. If the unstructured half-plate run branches
#   late or develops extra/deviated branches while this run produces a cleaner
#   Y, mesh regularity is a primary suspect.
#
# Acceptance (compare.py --half-plate):
#   - branching onset 33 us +/-20%
#   - full Y by 75 us
#   - elastic-energy peak 0.13 - 0.14 J at thickness 1 m
#
# HPC:
#   B7_CONFIG=configs/B7_debug/B7_half_plate_comsol_structured.yaml \
#       bash scripts/submit_job_auto.sh \
#       scripts/slurm/benchmarks/hpc_b7_dynamic_branching.slurm \
#       --gpu a100_80g
# =====================================================================

problem:
  name: COMSOL Dynamic Crack Branching (half-plate + volDev/Amor + structured mapped-grid T3)
  reference: "COMSOL 6.4 Application Library 'Dynamic Crack Branching' (PDFs in examples/dynamic/crack_branching_comsol/)"

geometry:
  type: rectangular_sent_comsol_structured
  parameters:
    W: 100.0
    H: 20.0                 # COMSOL symmetry domain: sample height/2
    a: 50.0
    l0: 0.5
    h_crack: 0.125
    h_coarse: 1.0

material:
  E: 32000.0
  nu: 0.20
  Gc: 3.0e-3
  l0: 0.5
  rho: 2.45e-9
  energy_split: amor
  pf_model: AT1
  eta_residual: 1.0e-7

boundary_conditions:
- {nodes: top,         type: neumann,      component: 1, value: 1.0}
- {nodes: bottom_sym,  type: fix,          component: 1}
- {nodes: left,        type: fix,          component: 0}
- {nodes: crack,       type: pf_dirichlet, value: 1.0}

initial_conditions:
  preseed_notch_nodesets: [crack]

loading:
  protocol: simple
  ramp_type: smooth_step
  dt: 8.0e-9
  t_ramp: 5.0e-8
  t_total: 80.0e-6
  num_steps: 0

solver:
  solver_type: explicit
  dt_safety: 0.8
  use_multigrid: false
  bounds_method: projected_cg
  damage_every: 2
  eta_residual: 1.0e-7

output:
  h5: true
  h5_every: 50
  fast: true
  print_every: 200

device:
  device: cpu
