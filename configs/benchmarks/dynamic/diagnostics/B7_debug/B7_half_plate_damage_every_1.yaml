# =====================================================================
# B7 -- Dynamic crack branching, COMSOL 6.4 reference (HALF-PLATE +
# symmetry BC). Issue #299 route (A): match COMSOL geometry exactly
# instead of mirroring to an oversized full-plate.
#
# Geometry: COMSOL sample height is 40 mm, but the symmetry-reduced
# model is 100 x 20 mm. Precrack along y=0 from x=0 to x=50 is
# enforced by pf_dirichlet. Symmetry BC u_y=0 on the bottom-
# right segment (x in [50, 100]). Top edge tractioned at +1 MPa
# (no traction on the symmetry plane).
#
# Why this variant exists
# -----------------------
# Full-plate equivalent (configs/benchmarks/dynamic/B7_dynamic_crack_branching_comsol.yaml)
# branches at ~80 us in our solver vs ~33 us in COMSOL (jobs 29104,
# 29115, 29126). The stale doubled-height full-plate run (29126) does not
# branch in 200 us. Hypothesis: sample-bound conditions in the full-plate
# mirror differ from the COMSOL setup at the symmetry plane (issue
# #299). This config is the head-to-head test.
#
# Acceptance (compare.py --half-plate):
#   - branching onset 33 us +/-20%
#   - full Y by 75 us
#   - elastic-energy peak 0.13 - 0.14 J at thickness 1 m
#     (HALF of the full-plate equivalent)
#
# Run:
#   python -m phast run \
#       configs/B7_debug/B7_half_plate_symmetric.yaml
# HPC:
#   B7_CONFIG=configs/B7_debug/B7_half_plate_symmetric.yaml \
#       bash scripts/submit_job_auto.sh hpc_b7_dynamic_branching.slurm
# =====================================================================

problem:
  name: COMSOL Dynamic Crack Branching (half-plate + damage_every:1 (lag probe, audit 2026-05-08), #299)
  reference: "COMSOL 6.4 Application Library 'Dynamic Crack Branching' (PDFs in examples/dynamic/crack_branching_comsol/)"

geometry:
  type: rectangular_sent
  parameters:
    W: 100.0
    H: 20.0                # COMSOL symmetry domain: sample height/2
    a: 50.0
    l0: 0.5
    h_crack: 0.125         # l0/4 (COMSOL p.10)
    h_coarse: 1.0
    branching: true        # uniform fine mesh in the right half
    half_plate: true       # precrack along y=0; bottom split into
                           # 'crack' + 'bottom_sym' physical groups

material:
  E: 32000.0
  nu: 0.20
  Gc: 3.0e-3
  l0: 0.5
  rho: 2.45e-9
  energy_split: spectral
  pf_model: AT1
  eta_residual: 1.0e-7

# Boundary conditions
# -------------------
# - top:        sigma_n = +1 MPa (traction, smooth ramp via loading.ramp_type)
# - bottom_sym: u_y = 0           (symmetry plane on x in [a, W])
# - crack:      pf_dirichlet=1    (precrack along y=0, x in [0, a])
# - left:       u_x = 0 at corner (rigid-body x removal)
boundary_conditions:
- {nodes: top,         type: neumann,      component: 1, value: 1.0}
- {nodes: bottom_sym,  type: fix,          component: 1}
- {nodes: left,        type: fix,          component: 0}
- {nodes: crack,       type: pf_dirichlet, value: 1.0}

initial_conditions:
  preseed_notch_nodesets: [crack]

loading:
  protocol: simple
  ramp_type: smooth
  t_ramp: 5.0e-8
  t_total: 80.0e-6
  num_steps: 0

solver:
  solver_type: explicit
  dt_safety: 0.8
  use_multigrid: false
  bounds_method: projected_cg
  damage_every: 1
  eta_residual: 1.0e-7  # was 1.0e-6 (legacy default); aligned with Material (#272/#276)

output:
  h5: true
  h5_every: 50
  fast: true
  print_every: 200

device:
  device: cpu
